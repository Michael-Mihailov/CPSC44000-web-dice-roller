<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Dice Roller</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header class="d-flex flex-column align-items-center">
            <h1>Yahtzee Dice Roller</h1>
            <div class="Game-Description">
                <p>This website can be used in place of real dice to play Yahtzee! Press the “Roll Dice” button to roll all five dice...</p>
            </div>
        </header>
        <section class="Dice">
            <div class="Die">
                
            </div>
        </section>
        <section class="User-Input d-flex flex-column align-items-center">
            <button class="btn btn-primary btn-lg" autofocus onclick="() => {}">
                Roll Dice!
            </button>
        </section>
    </main>
    <script src="main.js"></script>
</body>
</html>
